version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-drink-db
    environment:
      POSTGRES_DB: aidrink
      POSTGRES_USER: aidrink
      POSTGRES_PASSWORD: aidrink_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
