[build]
  command = "npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build"
  publish = ".next"

[build.environment]
  DATABASE_URL = "file:./prisma/dev.db"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["prisma/dev.db", "node_modules/.prisma/**"]
  node_bundler = "nft"
